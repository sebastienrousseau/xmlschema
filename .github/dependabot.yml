# Dependabot keeps both dependency trees current.
#
# Scorecard's Dependency-Update-Tool check looks for exactly this file.
# It scored zero without it, which was accurate: nothing was watching
# for a vulnerable transitive dependency between `cargo audit` runs.
#
# GitHub Actions are pinned by commit SHA rather than tag, so a moved
# tag cannot change what runs. Dependabot understands that pinning and
# updates the SHA while keeping the `# v4` comment accurate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `dtolnay/rust-toolchain@1.98.0` is not an action version, it is
      # the *Rust toolchain* this project pins -- the same version in
      # rust-toolchain.toml and in scripts/gate.sh. Dependabot read it
      # as a stale dependency and opened a pull request moving the
      # whole suite to a different compiler, which failed six checks.
      #
      # Changing the toolchain is a deliberate decision made in one
      # place, not a dependency bump.
      - dependency-name: dtolnay/rust-toolchain
