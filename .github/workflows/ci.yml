name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on `pull_request`. With one, a pull request
  # whose base is another branch -- a stacked PR, the natural shape for
  # a change that builds on an unmerged one -- matches nothing and gets
  # **no checks at all**. Not a red build: an empty one, which reads as
  # "nothing to report" rather than "nothing ran".
  #
  # `push` stays pinned to `main` so a branch does not build twice, once
  # for the push and once for its pull request.
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --all-features

  msrv:
    name: MSRV 1.86.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The manifest claims 1.86.0; nothing was checking that claim.
      - run: cargo check --all-features

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The examples assert rather than print, so running them checks
      # the API they demonstrate still behaves as documented. `cargo
      # test` builds examples but never runs them, which reads as
      # coverage it is not.
      #
      # Discovered rather than listed: this job named `validate` alone,
      # so an example added later would have been built and never run.
      - name: Run every example, which asserts its own output
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; [print(t["name"]) for p in json.load(sys.stdin)["packages"] for t in p["targets"] if "example" in t["kind"]]' \
            | while read -r name; do
                echo "== $name"
                cargo run -q --example "$name"
              done

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A requirement nothing verifies is a request. This checks every
      # commit the pull request adds, and reports all failures at once
      # rather than the first -- rewriting history twice because the
      # second bad commit was hidden by the first is a waste of
      # everyone's afternoon.
      - name: Every commit must carry a Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          [ -n "$base" ] || { echo "not a pull request; nothing to check"; exit 0; }

          fail=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Bots cannot sign off, and requiring it of them would
            # block every Dependabot update on a technicality.
            case "$author" in
              *"[bot]"*|*"dependabot"*) continue ;;
            esac
            if ! git log -1 --format='%B' "$sha" | grep -qi "^Signed-off-by: .\+ <.\+@.\+>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by"
              fail=1
            fi
          done <<< "$(git rev-list "$base..$head")"

          if [ "$fail" -ne 0 ]; then
            echo "Sign off with: git commit -s  (or: git rebase --signoff $base)"
            echo "See DCO in the repository root for what you are certifying."
            exit 1
          fi
          echo "every commit is signed off"

  branch-coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    # Branch coverage needs nightly; `rust-toolchain.toml` would
    # otherwise pin this job to the release toolchain, where
    # `cargo llvm-cov --branch` does not build.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # main
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # cargo-llvm-cov has --fail-under-lines but no branch equivalent,
      # so the floor is enforced by reading the summary. Branch
      # coverage is the weaker of the two measures precisely because it
      # is the harder one to reach, so the bar is 80 rather than 95.
      - name: Branch coverage must stay above 80%
        run: |
          cargo llvm-cov --branch --all-features --summary-only \
            --ignore-filename-regex 'builds/cargo/package' | tee /tmp/branch.txt
          awk '/^TOTAL/{
            gsub(/%/,"",$NF)
            if ($NF+0 < 80) {
              print "::error::branch coverage " $NF "% is below the 80% floor"
              exit 1
            }
            print "branch coverage " $NF "%"
          }' /tmp/branch.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      # `--workspace`, or the `conformance` crate is never linted: it
      # is a workspace member and not the default package, so the
      # command without it had been checking the library alone. Ten
      # errors had accumulated there unseen.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  example-coverage:
    name: Examples cover the public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # main
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The README says the examples cover the public API. That claim
      # decays silently, so it is measured rather than trusted: every
      # `pub fn` must be *executed* by an example, not merely mentioned.
      - run: python3 scripts/check-example-coverage.py

  unsafe:
    name: Forbid unsafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The crate must forbid unsafe code
        run: |
          if ! grep -rq '#!\[forbid(unsafe_code)\]' src/; then
            echo "::error::#![forbid(unsafe_code)] is missing"
            exit 1
          fi
          echo "unsafe_code is forbidden"

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # cargo-fuzz needs nightly, and the pinned toolchain would
    # otherwise replace it.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [parse_schema, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      # `cargo install` rather than a prebuilt: a prebuilt landed
      # somewhere `cargo fuzz` could not find under a pinned
      # toolchain, giving `no such command: fuzz`.
      - run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Seeds matter more than run time. From an empty corpus libFuzzer
      # spends almost the whole budget on inputs that are not XML at
      # all, and reaches almost no schema code.
      - name: Seed the corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/
      - name: Fuzz for 300s
        run: >
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=300 -timeout=10
      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  conformance:
    name: W3C XSD conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cache the suite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: conformance/data
          key: xsts-2007-06-20-v1
      # The download verifies a pinned SHA-256. That is not ceremony:
      # a host behind a challenge page answers a request without a
      # browser User-Agent with an HTML body and HTTP 200, which
      # extracts to an empty directory. The suite would then be
      # "present" and hold nothing.
      - run: cargo run --release -p xmlschema-conformance --bin download
      # `XMLSCHEMA_REQUIRE_SUITE=1` so a missing or empty suite fails
      # here rather than skipping. A skipped test is a passing test to
      # `cargo test`, so without this the job could report success
      # having run none of the 39,420 -- which is what the empty
      # extraction above would produce.
      - run: cargo test --release -p xmlschema-conformance
        env:
          XMLSCHEMA_REQUIRE_SUITE: "1"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # main
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every defect fixed in 0.0.3 was found by raising coverage, not
      # by reading the code. The floor keeps that from eroding: a new
      # branch nothing exercises fails here rather than shipping.
      - run: >
          cargo llvm-cov --all-features --fail-under-lines 95
          --ignore-filename-regex 'builds/cargo/package'
