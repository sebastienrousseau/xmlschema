name: CodeQL

# Scorecard's SAST check scores 0 without a recognised static-analysis
# tool, and clippy does not count towards it. CodeQL's Rust support is
# recent, so this workflow is being trialled rather than assumed: if
# the analysis does not actually run on this codebase, the file should
# be removed rather than left as a job that reports success over
# nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    - cron: "0 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4be18c39b85c13e5a593361c77508494f6c # master
        with:
          toolchain: stable

      - name: Initialise CodeQL
        uses: github/codeql-action/init@b96794f87a329d511ea6da56b26d3dbdf2bf9b59 # v4.38.0
        with:
          languages: rust
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@b96794f87a329d511ea6da56b26d3dbdf2bf9b59 # v4.38.0
        with:
          category: "/language:rust"
