# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Scorecard

# Run the verified upstream executable without its mutable image tag.
# Public Scorecard publication is disabled: its workflow allowlist does
# not accept digest-pinned container steps. Keep posture findings visible
# as artifacts and categorized code-scanning results, separate from CodeQL.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check Scorecard policy
        run: python3 scripts/test-scorecard-policy.py

      # v2.5.0, linux/amd64; GitHub build provenance binds this digest to
      # ossf/scorecard-action commit fa7117db83c52d787ae5a89f350999701505d78e.
      # Direct container steps do not inherit action.yaml input defaults.
      - name: Run analysis
        uses: docker://ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
        env:
          INPUT_RESULTS_FILE: results.sarif
          INPUT_RESULTS_FORMAT: sarif
          INPUT_FILE_MODE: archive
          INPUT_REPO_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_RESULTS: "false"

      # On pull_request events, scorecard-action skips online-scm and
      # branch-protection checks and omits their SARIF runs, causing GitHub
      # Code Scanning to report "2 configurations not found" against main.
      - name: Ensure all Scorecard SARIF configurations are present
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("results.sarif")
          sarif = json.loads(path.read_text())
          runs = sarif.get("runs", [])
          if runs:
              base_id = runs[0].get("automationDetails", {}).get("id", "")
              suffix = base_id.rsplit("/", 1)[-1] if "/" in base_id else "pr"
              driver = runs[0].get("tool", {}).get("driver", {})
              existing = {
                  r.get("automationDetails", {}).get("id", "").rsplit("/", 1)[0]
                  for r in runs
              }
              for cat in ("supply-chain/branch-protection", "supply-chain/online-scm"):
                  if cat not in existing:
                      runs.append({
                          "automationDetails": {"id": f"{cat}/{suffix}"},
                          "tool": {
                              "driver": {
                                  "name": driver.get("name", "Scorecard"),
                                  "informationUri": driver.get(
                                      "informationUri",
                                      "https://github.com/ossf/scorecard",
                                  ),
                                  "semanticVersion": driver.get(
                                      "semanticVersion", "v5.6.0"
                                  ),
                                  "rules": [],
                              }
                          },
                          "results": [],
                      })
              path.unlink()
              path.write_text(json.dumps(sarif, indent=2) + "\n")
          PY

      # Retain comparisons for five days; missing output is a failure.
      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard SARIF
          path: results.sarif
          retention-days: 5
          if-no-files-found: error

      # Fork PRs retain the artifact without requiring write access.
      # These are repository posture findings, not source-code defects;
      # do not dismiss them merely to reduce the alert count.
      - name: Upload posture results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: /tool:scorecard
