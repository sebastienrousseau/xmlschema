[package]
name = "xmlschema"
version = "0.0.3"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "XML Schema (XSD) validation for Rust, with zero unsafe code"
repository = "https://github.com/sebastienrousseau/xmlschema"
homepage = "https://github.com/sebastienrousseau/xmlschema"
documentation = "https://docs.rs/xmlschema"
readme = "README.md"
keywords = ["xml", "xsd", "schema", "validation", "safe"]
categories = ["parser-implementations", "encoding"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
autoexamples = false
include = [
    "/Cargo.toml",
    "/examples/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[dependencies]
oxml = { version = "0.0.3", default-features = false, features = ["std"] }

[dev-dependencies]

[[example]]
name = "validate"
path = "examples/validate.rs"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "forbid"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
