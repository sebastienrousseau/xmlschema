# cargo-deny configuration.

[advisories]
yanked = "deny"

[licenses]
# The crate is dual MIT/Apache-2.0; dependencies must be compatible
# with both, which in practice means permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a crate in this same workspace has no version to
# pin, and pinning one would have to be bumped in lockstep for no
# benefit. This permits exactly that case and nothing else: a wildcard
# on a crates.io dependency is still an error.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
